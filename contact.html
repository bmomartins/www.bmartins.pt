<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bruno Martins' Corner</title>
    <script>
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="css/styles.css">
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "tzzls5opx7");
    </script>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col">
    <div id="header-container"></div>
    <main class="flex-1 max-w-3xl mx-auto w-full px-6 py-10">
        <h2 class="text-xl font-semibold text-blue-600 dark:text-blue-400 mb-2">Get in Touch</h2>
        <p class="text-zinc-500 dark:text-zinc-400 mb-8">Have a question or want to connect? Fill out the form and I'll get back to you.</p>

        <div id="form-container" class="bg-zinc-50 dark:bg-zinc-900 rounded-lg p-8 border border-zinc-200 dark:border-zinc-800">
            <form id="contact-form" method="POST" novalidate>

                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Name</label>
                            <input type="text" id="name" name="name" required
                                class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-md px-4 py-3 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                                placeholder="Your name">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Email</label>
                            <input type="email" id="email" name="email" required
                                class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-md px-4 py-3 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                                placeholder="your@email.com">
                        </div>
                    </div>

                    <div>
                        <label for="subject" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Subject</label>
                        <input type="text" id="subject" name="subject" required
                            class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-md px-4 py-3 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="What's this about?">
                    </div>

                    <div>
                        <label for="message" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Message</label>
                        <textarea id="message" name="message" rows="6" required
                            class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-md px-4 py-3 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="Your message..."></textarea>
                    </div>

                    <div class="flex items-center justify-between gap-4">
                        <p id="form-error" class="text-red-500 dark:text-red-400 text-sm hidden"></p>
                        <button type="submit" id="submit-btn"
                            class="ml-auto bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap">
                            Send Message
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div id="success-container" class="hidden bg-zinc-50 dark:bg-zinc-900 rounded-lg p-8 border border-zinc-200 dark:border-zinc-800 text-center">
            <div class="text-5xl mb-4">✅</div>
            <h3 class="text-xl font-semibold text-zinc-900 dark:text-white mb-2">Message Sent!</h3>
            <p class="text-zinc-500 dark:text-zinc-400 mb-6">Thanks for reaching out. I'll get back to you as soon as possible.</p>
            <button onclick="document.getElementById('success-container').classList.add('hidden'); document.getElementById('form-container').classList.remove('hidden'); document.getElementById('contact-form').reset();"
                class="text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300 text-sm transition-colors">
                Send another message →
            </button>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="js/main.js"></script>
</body>
</html>
